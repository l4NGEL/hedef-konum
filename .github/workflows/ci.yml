name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Derle
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Senaryo
        shell: bash
        run: |
          mkdir -p cikti
          if [ -f build/Release/hk_senaryo.exe ]; then build/Release/hk_senaryo.exe cikti; else build/hk_senaryo cikti; fi
